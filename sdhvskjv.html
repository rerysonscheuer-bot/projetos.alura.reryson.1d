    <!-- Scripts de Interatividade -->
    <script>
        // FUNÇÃO DO TEMA: Liga e desliga a classe 'tema-escuro' no <body> a cada clique
        function alternarTema() {
            document.body.classList.toggle('tema-escuro');
        }

        // FUNÇÃO DE SOM: Sintetiza áudios dinâmicos via Web Audio API para cada instrumento
        function tocarNota(instrumento) {
            // Cria o contexto de áudio do navegador
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            
            // Cria os nós principais de áudio
            const oscilador = ctx.createOscillator();
            const ganho = ctx.createGain();
            
            oscilador.connect(ganho);
            ganho.connect(ctx.destination);
            
            const agora = ctx.currentTime;
            
            // Configurações de áudio específicas para simular cada instrumento
            switch(instrumento) {
                case 'trompete':
                    oscilador.type = 'sawtooth'; // Som brilhante/metálico
                    oscilador.frequency.setValueAtTime(440, agora); // Nota Lá (A4)
                    ganho.gain.setValueAtTime(0, agora);
                    ganho.gain.linearRampToValueAtTime(0.3, agora + 0.1); // Ataque rápido
                    ganho.gain.exponentialRampToValueAtTime(0.01, agora + 0.8); // Sustentação média
                    oscilador.start(agora);
                    oscilador.stop(agora + 0.8);
                    break;
                    
                case 'atabaque':
                    oscilador.type = 'triangle'; // Som focado em graves
                    oscilador.frequency.setValueAtTime(110, agora); // Nota grave
                    oscilador.frequency.exponentialRampToValueAtTime(65, agora + 0.15); // Queda de tom do tambor
                    ganho.gain.setValueAtTime(0.6, agora);
                    ganho.gain.exponentialRampToValueAtTime(0.01, agora + 0.3); // Decaimento rápido
                    oscilador.start(agora);
                    oscilador.stop(agora + 0.3);
                    break;
                    
                case 'flauta':
                    oscilador.type = 'sine'; // Onda pura e suave
                    oscilador.frequency.setValueAtTime(587.33, agora); // Nota Ré aguda (D5)
                    ganho.gain.setValueAtTime(0, agora);
                    ganho.gain.linearRampToValueAtTime(0.2, agora + 0.15); // Ataque suave
                    ganho.gain.exponentialRampToValueAtTime(0.01, agora + 1.2); // Som longo
                    oscilador.start(agora);
                    oscilador.stop(agora + 1.2);
                    break;
                    
                case 'violao':
                    oscilador.type = 'triangle';
                    oscilador.frequency.setValueAtTime(196, agora); // Nota Sol (G3)
                    ganho.gain.setValueAtTime(0.4, agora);
                    ganho.gain.exponentialRampToValueAtTime(0.01, agora + 1.0); // Vibração longa da corda
                    oscilador.start(agora);
                    oscilador.stop(agora + 1.0);
                    break;
                    
                case 'bateria':
                    // Simulação rápida de um bumbo com caixa (frequência cai rápido com distorção curta)
                    oscilador.type = 'square';
                    oscilador.frequency.setValueAtTime(150, agora);
                    oscilador.frequency.exponentialRampToValueAtTime(50, agora + 0.1);
                    ganho.gain.setValueAtTime(0.5, agora);
                    ganho.gain.exponentialRampToValueAtTime(0.01, agora + 0.15);
                    oscilador.start(agora);
                    oscilador.stop(agora + 0.15);
                    break;
            }
        }
    </script>
</body>
